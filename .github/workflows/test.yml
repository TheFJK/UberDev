name: Tests

on:
  push:
    branches: [main]
  pull_request:

# One CI set per change (#309, RFC 0012 §7.7 infra-R2). The unfiltered
# push+pull_request pair used to fire TWO full runs for every push to a PR
# branch, and a concurrency group ALONE cannot dedupe that pair: the group
# keys differ per event (a push run keys on refs/heads/<branch>, the
# pull_request run on refs/pull/<N>/merge), so the push branch filter above
# is the load-bearing half — PR branches now get exactly one run, via the
# authoritative pull_request event. The group below then cancels a
# superseded PR run when a newer push lands on the same ref. Tag pushes
# (releases) no longer trigger a run; the tagged SHA was already tested by
# its push-to-main run.
#
# cancel-in-progress is ref-conditional: post-merge runs on main are NEVER
# cancelled — sequential-release drives land PRs minutes apart, and the
# per-commit main CI signal must survive every landing (a cancelled main
# run would leave a release commit with no green check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default. PR runs from forks otherwise inherit a write token
# and would gate on enabling `Send write tokens to workflows from fork pull
# requests` in repo settings. Read-only is sufficient for shape checks.
permissions:
  contents: read

jobs:
  shape-checks:
    name: shape-checks ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # SHARDED SIX WAYS. The block below is one sequential loop over ~130
    # fixtures, and its cost distribution is extremely skewed: measured on run
    # 32587359768, the slowest five fixtures are 44% of the wall time and the
    # slowest single one is 16%. A round-robin or alphabetical split would leave
    # one shard carrying most of the suite, so the split is a weight-aware
    # bin-pack -- see tests/ci-shard-plan.py.
    #
    # Six, not more: the pack's makespan floors at the cost of the single
    # slowest fixture (~204s), which an eighth shard cannot divide. Six lands
    # every shard at ~219s with the fixtures evenly distributed around it.
    #
    # fail-fast is OFF. A red shard must not cancel the other five: the whole
    # point of de-chaining (#628) was that a job report the complete result
    # rather than "nothing failed before it stopped", and cancelling siblings
    # reintroduces exactly that at the job level.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Routed lifecycle, semaphore-race, and provider-contract fixtures made the
    # complete Linux suite exhaust its 30-minute budget even though the final
    # suite reported 91/0 only 89 ms before cancellation. Forty minutes retains
    # a bounded hang guard with ten minutes of runner-variance/recovery headroom.
    # ci-wiring.test.sh locks that exact budget so it cannot silently regress.
    # Caps the default 360-min budget so a hung test from a fork PR can't burn
    # the public-repo Actions allowance. Bump if the suite legitimately grows.
    #
    # Twelve, down from forty, because a SHARD is not the suite: the pack puts
    # ~219s of measured work in each. Twelve keeps roughly a 3x margin over that
    # for runner variance while restoring a hang guard worth having -- a
    # forty-minute ceiling on a four-minute shard is not a guard, it is a
    # sixteen-fold licence to hang.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # #505. tests/vendor-provenance.test.sh V30 re-derives each recorded
          # `base_evidence` blob with `git rev-parse <vendored_ref>:<path>`.
          # `vendored_ref` is a real commit of this repository, so the default
          # shallow checkout cannot resolve it — and the row FAILS rather than
          # skipping, because a proof that quietly stands down in CI is the
          # vacuous-green class that suite exists to refuse. Only this job needs
          # it: the Windows job skips that suite and the macOS job never runs it.
          fetch-depth: 0
      - name: Install zsh
        # ubuntu-latest does not ship zsh by default. tests/solve-pipeline-zsh.test.sh
        # is a zsh-runtime fixture that locks the v0.22.2 regression
        # (the v0.22.1 scalar `EFFORT_FLAG="--effort max"` broke under zsh's
        # SH_WORD_SPLIT=off). Without zsh on PATH the fixture cannot run.
        # Dropped `-qq` from apt-get so install diagnostics (network, GPG,
        # mirror failures) surface in the action log instead of being hidden
        # behind a downstream `zsh: command not found`. Added
        # `--no-install-recommends` to trim CI runtime (the fixture only
        # needs the zsh binary, not the recommends graph).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Plan shard ${{ matrix.shard }} of 6
        # Writes UBERDEV_SHARD_PLAN / UBERDEV_SHARD / UBERDEV_SHARDS for the step
        # below. Reads the job's own fixture list back out of this file, so the
        # `run_one` lines stay the single source of truth and no manifest can
        # drift from them. Exits non-zero rather than emitting an empty plan --
        # the harness treats an absent plan as "run everything", which is the
        # right default when it is extracted and run standalone and the wrong
        # one when a pack has broken.
        run: bash tests/ci-shard-env.sh shape-checks 6 "${{ matrix.shard }}" >> "$GITHUB_ENV"
      - name: Dump shard plan bytes
        # DIAGNOSTIC, NEVER A GATE (#753). The plan crosses a $GITHUB_ENV file
        # between the step above and the step below: this repo's shell writes
        # it, the runner reads it back. The working model is that on
        # windows-latest that boundary is where a trailing CR disappears while
        # the interior ones survive, which is the shape that makes the harness
        # membership test match only the last entry of the plan and reports a
        # green job that ran one fixture. A dump of ONE side cannot tell that
        # apart from a plan with no CR at all, so this step dumps both and
        # probes each planned name through the harness's own rule. It exits 0
        # by design; the gates are the CR refusal in tests/ci-shard-env.sh and
        # the SHARD-COVERAGE tail below. That producing half is MODELLED, not
        # measured — this step is where a Windows runner settles it; see "What
        # is settled, and what is still a model" in
        # plugins/uberdev/docs/testing.md for the refutation condition.
        run: bash tests/ci-shard-diagnose.sh dump shape-checks 6 "${{ matrix.shard }}"
      - name: Run shape-check tests
        # SYNC: this list MUST match the windows-latest job below, PLUS the
        # ubuntu-only Unix-runtime fixtures the Windows job intentionally skips:
        #   - solve-pipeline-zsh.test.sh         (needs zsh on PATH)
        #   - testers-pipeline.test.sh           (python3 -c with mktemp -d paths
        #                                         Git Bash on Windows mistranslates)
        #   - uberscan.test.sh / uberscan-report.test.sh / uberscan-chunk.test.sh
        #                                         (same python3 -c + path reason)
        #   - merge-discovery-resilience.test.sh (executes the executable fake-gh
        #                                         fixture via PATH + sources
        #                                         lib/discover.sh — neither proven
        #                                         on Git Bash; the fixture's +x bit
        #                                         is not reliably preserved on a
        #                                         Windows checkout) [#196]
        #   - testers-agent-contract.test.sh / testers-rate-limit-audit.test.sh /
        #     testers-rate-limit-wrapper.test.sh (python3 + PyYAML, same reason as
        #                                         testers-pipeline) [#196]
        #   - ubersimplify-aggregate.test.sh    (aggregate.py imports yaml and
        #                                         PyYAML is not importable on
        #                                         windows-latest; it now refuses
        #                                         rather than reporting success
        #                                         over an unexecuted body) [#520]
        #   - uberthink.test.sh / uberthink-report.test.sh
        #                                         (python3 -c + mktemp -d paths,
        #                                         same reason as uberscan-report)
        # When a test file is added or removed, update BOTH jobs by hand.
        # tests/ci-wiring.test.sh (#210) enforces this convention as an
        # invariant: it asserts every tests/*.test.sh on disk is wired into
        # the ubuntu run: block AND that (ubuntu − windows) matches the
        # `ci-wiring windows-skip-list` marker block in the windows job
        # below. Ran first in both jobs so a wiring drift reds CI fast.
        run: |
          # De-chained (#628). This block used to be ONE shell command list joined by
          # `&& \`, so the first non-zero exit skipped every invocation after it and the
          # job could only ever report "nothing failed before it stopped". run_one calls
          # every fixture, accumulates the failures, and the tail exits non-zero naming
          # them. tests/ci-wiring.test.sh W12 locks the shape AND runs this harness.
          #
          # SHARDED. UBERDEV_SHARD_PLAN carries this shard's fixture basenames,
          # space-separated, from the plan step above. The list below stays complete and
          # in declaration order in EVERY shard -- it is the single source of truth the
          # plan step reads back out of this file, so a sharded job and an unsharded one
          # cannot disagree about what the suite contains.
          #
          # UNSET means run everything, deliberately: W12.3 extracts this harness and
          # executes it standalone against synthetic fixtures that belong to no plan, and
          # for a test runner the safe default is to run MORE than asked, never less.
          # That default is not how a broken pack arrives here -- tests/ci-shard-env.sh
          # exits non-zero rather than emitting an empty plan, so the job dies at the
          # planning step instead of silently running the whole suite six times.
          fail=0
          failed=""
          shard_routed=0
          shard_ran=0
          run_one() {
            run_one_routed=0
            if [ -n "${UBERDEV_SHARD_PLAN-}" ]; then
              # Keyed on the argument that IS a fixture path, found by scanning.
              # Neither the first nor the last argument works: the interpreter
              # varies (`bash`, `zsh`, `env MSYSTEM=MSYS bash`) and three Windows
              # rows pass a trailing flag (`tests/run-manifest.test.sh
              # --artifact-publication-only`), so keying on the last argument
              # silently dropped exactly those three.
              #
              # And NOT `${*##*/}`: that applies the strip to EACH positional and
              # then joins, so `bash tests/x.test.sh` yields `bash x.test.sh`,
              # matches no plan entry, skips every fixture, and reports a green job
              # that ran nothing.
              #
              # No match means RUN, which is how W12.3's synthetic fixtures
              # (`bash <tmpdir>/a.sh`) survive the filter. Both of these bugs were
              # caught by S8 in tests/ci-shard.test.sh, which drives this function
              # with real argv rather than re-implementing its logic.
              run_one_fixture=""
              for run_one_arg in "$@"; do
                case "$run_one_arg" in
                  tests/*.test.sh|tests/*.test.py) run_one_fixture="${run_one_arg##*/}" ;;
                esac
              done
              if [ -n "$run_one_fixture" ]; then
                shard_routed=$((shard_routed + 1))
                run_one_routed=1
                case " ${UBERDEV_SHARD_PLAN} " in
                  *" ${run_one_fixture} "*) : ;;
                  *) echo "--- SKIP $* (shard ${UBERDEV_SHARD:-?}/${UBERDEV_SHARDS:-?})"; return 0 ;;
                esac
              fi
            fi
            if [ "$run_one_routed" -eq 1 ]; then
              shard_ran=$((shard_ran + 1))
            fi
            echo "--- RUN  $*"
            if "$@"; then
              echo "--- PASS $*"
            else
              rc=$?
              echo "--- FAIL $* (rc=$rc)"
              fail=$((fail + 1))
              failed="${failed}${failed:+ | }$*"
            fi
          }
          run_one bash tests/ci-wiring.test.sh
          run_one bash tests/ci-shard.test.sh
          run_one bash tests/turbo-flow.test.sh
          run_one bash tests/issue-causal-fanout.test.sh
          run_one bash tests/post-impl-review.test.sh
          run_one bash tests/testers-pipeline.test.sh
          run_one bash tests/spec-reviewer-plan-aware.test.sh
          run_one bash tests/leaf-worker-contract.test.sh
          run_one bash tests/sdd-routed-lifecycle.test.sh
          run_one bash tests/audit-fixups.test.sh
          run_one bash tests/agent-description-budget.test.sh
          run_one bash tests/review-pr.test.sh
          run_one bash tests/review-pr-entry.test.sh
