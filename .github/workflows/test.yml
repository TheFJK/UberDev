#                                       heredocs over mktemp -d paths.)
#   - review-pr-phase3-ci.test.sh
#   - lib-assert-count.test.sh
#   - status.test.sh                      (#310 fixtures drive python3 over
#                                         mktemp -d paths, POSIX ownership
#                                         predicates and `touch -t` mtime
#                                         forgery; lib/status.sh itself stays
#                                         portable — only the harness is
#                                         Unix-bound)
#   - trust-trail-base-identity.test.sh   (#440: the TB-D matrix builds five real
#                                         git histories under mktemp -d and
#                                         probes `git merge-tree --write-tree`;
#                                         the shipped lib/base-identity.sh and
#                                         the carrier pair themselves stay
#                                         portable -- only this harness is
#                                         Unix-verified, same class as
#                                         status.test.sh)
#   - dispatch-child-worktree-teardown.test.sh
#                                         (#381 RULING 4: real `git worktree
#                                         add` + nohup detachment + the POSIX
#                                         ownership predicate in
#                                         _uberdev_dispatch_validate_worktree_directory,
#                                         same Unix-bound harness class as
#                                         status.test.sh; the teardown code
#                                         itself stays portable)
# === END ci-wiring windows-skip-list ===
        # review-child-handoff and run-manifest use bounded native-Windows
        # modes for carrier/path serialization and captured publication retry;
        # their full Unix race fixtures remain in shape-checks above.
        #
        # simplify-standalone-flow.test.sh was DECLARED Unix-only while
        # simplify.test.sh — wired here — ran it as a nested child on this
        # runner and passed (#520). The skip-list is an SSOT, so the false half
        # was the declaration, not the execution: the fixture is now wired
        # top-level with the same MSYSTEM=MSYS entry environment the nested
        # invocation already proved green, and the runtime refusal guard W9
        # installs in every genuinely declared fixture makes the next such
        # mismatch red instead of silent.
        run: |
          bash tests/ci-wiring.test.sh && \
          bash tests/run-manifest.test.sh --artifact-publication-only && \
          bash tests/turbo-flow.test.sh && \
          bash tests/issue-causal-fanout.test.sh && \
