  supervision-smoke-macos:
    name: supervision-smoke-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install GNU timeout
        run: brew install coreutils
      - name: Run focused supervision smoke tests
        run: |
          bash tests/review-pr-entry.test.sh && \
          bash tests/agent-dispatch.test.sh && \
          bash tests/child-dispatch.test.sh && \
          bash tests/dispatch-child-worktree-teardown.test.sh && \
          bash tests/review-pr-workflow.test.sh && \
          bash tests/atomic-move.test.sh

  shape-checks-windows:
    name: shape-checks-windows
    runs-on: windows-latest
    # Proves the shape-check harness and routed dispatch lifecycle are portable
    # on native Windows/Git Bash. The exhaustive portability shard's measured
    # runtime outgrew the prior ceiling; thirty minutes provides runner-variance
    # headroom while preserving a meaningful hang guard.
    timeout-minutes: 30
    defaults:
      run:
        # Force every `run:` step into Git Bash, not PowerShell or cmd.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run shape-check tests
        # This list MUST match the ubuntu-latest job above MINUS the ubuntu-only
        # Unix-runtime fixtures, which are intentionally skipped here because Git
        # Bash on Windows can't run them reliably:
        #   - solve-pipeline-zsh.test.sh         (no zsh on windows-latest)
        #   - testers-pipeline.test.sh + testers-agent-contract.test.sh +
        #     testers-rate-limit-audit.test.sh + testers-rate-limit-wrapper.test.sh
        #                                         (python3 + PyYAML; the python3 -c
        #                                         invocations embed mktemp -d paths
        #                                         that resolve to /tmp/... strings
        #                                         python.exe can't translate)
        #   - uberscan.test.sh / uberscan-report.test.sh / uberscan-chunk.test.sh
        #                                         (same python3 -c + path reason)
        #   - uberthink.test.sh / uberthink-report.test.sh
        #                                         (same python3 -c + mktemp -d
        #                                         reason as uberscan-report)
        #   - merge-discovery-resilience.test.sh (executes the executable fake-gh
        #                                         fixture via PATH + sources
        #                                         lib/discover.sh — neither proven
        #                                         on Git Bash) [#196]
        #
        # Every test below is a portable grep-and-assert shape-check OR a runtime
        # fixture whose mechanism already runs green on this job. The #196
        # additions reuse: the _lib_assert_structural.sh awk-range lib
        # (code-fixer-dispatch / findings-to-issues / finish-branch / simplify /
        # trust-trail-evaluator); the `bash -c … uberdev_run_secret_scan_stdin`
        # pattern (finish-branch, mirroring secret-scan.test.sh); lib/config-read.sh
        # runtime (findings-to-issues, mirroring config-override.test.sh); and
        # chmod+x-stub execution (install, mirroring solve-effort-flag.test.sh).
        # When a test file is added or removed, update BOTH jobs by hand.
        # tests/ci-wiring.test.sh (#210) enforces the convention as a hard
        # invariant; the canonical Unix-only skip set is the marker block
        # below — a runtime drift fails CI immediately.
        #
        # === BEGIN ci-wiring windows-skip-list ===
        # Canonical SSOT of Unix-only fixtures intentionally skipped on
        # windows-latest. ci-wiring.test.sh W4 asserts
        # (ubuntu − windows) == this list. Update this block AND the run:
        # block below in lockstep; a new Unix-only fixture needs an entry
        # here AND its `bash tests/...` line in the ubuntu job above.
        #   - cluster-pipeline.test.sh
        #   - code-fixer-contract.test.sh
        #   - convention-citation.test.sh  (python3 -c over mktemp -d trees plus
        #                                   the code_fixer_contract CLI verb,
        #                                   same reason as
        #                                   code-fixer-contract.test.sh)
        #   - finish-branch-zsh.test.sh
        #   - goal-pipeline-zsh.test.sh
        #   - goal-state-zsh.test.sh
        #   - merge-pipeline-zsh.test.sh
        #   - solve-pipeline-zsh.test.sh
        #   - testers-pipeline.test.sh
        #   - testers-agent-contract.test.sh
        #   - testers-rate-limit-audit.test.sh
        #   - testers-rate-limit-wrapper.test.sh
        #   - ubersimplify-aggregate.test.sh    (aggregate.py does `import yaml`;
        #                                       PyYAML is not importable on
        #                                       windows-latest — the job printed
        #                                       `SKIP: PyYAML not installed` and
        #                                       ran none of the four sections —
        #                                       and the four testers-* fixtures
        #                                       above are declared here for the
        #                                       same dependency. COVERAGE LOSS
        #                                       (#520): the D7 envelope-breakout
        #                                       rows (#183) and their only mirror,
        #                                       uberscan-report.test.sh, are both
        #                                       Unix-only, so that property is
        #                                       unproven on native Windows — not
        #                                       merely untested here. It was
        #                                       already unproven before this
        #                                       entry existed; the file was wired
        #                                       into the job and left with a zero
        #                                       status having asserted nothing.)
        #   - uberscan.test.sh
        #   - uberscan-report.test.sh
        #   - uberscan-chunk.test.sh
        #   - uberthink.test.sh
        #   - uberthink-report.test.sh
        #   - merge-discovery-resilience.test.sh
        #   - model-routing.test.sh
        #   - model-routing-config.test.sh
        #   - plan-writer-routing.test.sh
        #   - live-semaphore.test.sh
        #   - agent-dispatch.test.sh
        #   - child-dispatch.test.sh
        #   - child-inputs.test.sh
        #   - child-wait.test.sh
        #   - child-contract-v2.test.sh
        #   - command-workspace.test.sh
        #   - production-run-tree-builder.test.sh
        #   - brainstorm-child-inputs.test.sh
        #   - orchestrator-child-inputs.test.sh
        #   - sdd-child-inputs.test.sh
        #   - review-child-inputs.test.sh
        #   - review-pr-consolidate.test.sh  (pty allocation for the [ -t 0 ]
        #                                    gate + real `git merge` conflict
        #                                    states, same reason as
        #                                    merge-discovery-resilience.test.sh)
        #   - review-pr-entry.test.sh
        #   - review-pr-workflow.test.sh    (python3 -c + the code_fixer_contract
        #                                    round-trip over mktemp -d paths, same
        #                                    reason as code-fixer-contract.test.sh)
        #   - routed-provider-bypass.test.sh
        #   - run-tree-callsite-contract.test.sh
        #   - route-context.test.sh
        #   - route-unsupported.test.sh
        #   - solve-routing.test.sh
        #   - solve-triage.test.sh
        #   - dispatch-routing-parity.test.sh
        #   - orchestrator-plan-flatten.test.sh
        #   - sdd-routed-lifecycle.test.sh
        #   - prkit-rewrite.test.sh
        #   - prkit-verify.test.sh
        #   - prkit-generate.test.sh
        #   - prkit-publish.test.sh        (sha256 over exact source bytes, and
        #                                   no .gitattributes rule covers these
        #                                   paths — the #461 rule is scoped to
        #                                   plugins/uberdev/hooks/ — so Windows
        #                                   checks out with core.autocrlf=true
        #                                   and every digest would differ)
        #   - vendor-provenance.test.sh    (#434: C-FILES digests sha256 over
