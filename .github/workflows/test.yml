        #                                   core.autocrlf reason as
        #                                   prkit-publish.test.sh)
        #   - vendor-drift.test.sh         (#434: PATH-stubbed `git`/`gh`
        #                                   executables over mktemp -d paths,
        #                                   same class as
        #                                   merge-discovery-resilience.test.sh)
#   - review-precision.test.sh          (#432: RP17 byte-compares a committed
#                                       .md against a fresh render, and no
#                                       .gitattributes rule covers these paths
#                                       (the #461 rule is scoped to
#                                       plugins/uberdev/hooks/), so Windows
#                                       checks out core.autocrlf=true and the
#                                       comparison cannot hold — same reason as
#                                       prkit-publish.test.sh. The fixture
