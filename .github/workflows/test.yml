name: Tests

on:
  push:
    branches: [main]
  pull_request:

# One CI set per change (#309, RFC 0012 §7.7 infra-R2). The unfiltered
# push+pull_request pair used to fire TWO full runs for every push to a PR
# branch, and a concurrency group ALONE cannot dedupe that pair: the group
# keys differ per event (a push run keys on refs/heads/<branch>, the
# pull_request run on refs/pull/<N>/merge), so the push branch filter above
# is the load-bearing half — PR branches now get exactly one run, via the
# authoritative pull_request event. The group below then cancels a
# superseded PR run when a newer push lands on the same ref. Tag pushes
# (releases) no longer trigger a run; the tagged SHA was already tested by
# its push-to-main run.
#
# cancel-in-progress is ref-conditional: post-merge runs on main are NEVER
# cancelled — sequential-release drives land PRs minutes apart, and the
# per-commit main CI signal must survive every landing (a cancelled main
# run would leave a release commit with no green check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default. PR runs from forks otherwise inherit a write token
# and would gate on enabling `Send write tokens to workflows from fork pull
# requests` in repo settings. Read-only is sufficient for shape checks.
permissions:
  contents: read

jobs:
  shape-checks:
    name: shape-checks
    runs-on: ubuntu-latest
    # 5 minutes is generous for the wired suite — 63 test files, ~2,700+
    # grep-and-assert checks, measured at #309 (ci-wiring.test.sh keeps the
    # run list below complete against tests/*.test.sh on disk; these counts
    # are a point-in-time snapshot, refresh when they age).
    # Caps the default 360-min budget so a hung test from a fork PR can't burn
    # the public-repo Actions allowance. Bump if the suite legitimately grows.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install zsh
        # ubuntu-latest does not ship zsh by default. tests/solve-pipeline-zsh.test.sh
        # is a zsh-runtime fixture that locks the v0.22.2 regression
        # (the v0.22.1 scalar `EFFORT_FLAG="--effort max"` broke under zsh's
        # SH_WORD_SPLIT=off). Without zsh on PATH the fixture cannot run.
        # Dropped `-qq` from apt-get so install diagnostics (network, GPG,
        # mirror failures) surface in the action log instead of being hidden
        # behind a downstream `zsh: command not found`. Added
        # `--no-install-recommends` to trim CI runtime (the fixture only
        # needs the zsh binary, not the recommends graph).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Run shape-check tests
        # SYNC: this list MUST match the windows-latest job below, PLUS the
        # ubuntu-only Unix-runtime fixtures the Windows job intentionally skips:
        #   - solve-pipeline-zsh.test.sh         (needs zsh on PATH)
        #   - testers-pipeline.test.sh           (python3 -c with mktemp -d paths
        #                                         Git Bash on Windows mistranslates)
        #   - uberscan.test.sh / uberscan-report.test.sh / uberscan-chunk.test.sh
        #                                         (same python3 -c + path reason)
        #   - merge-discovery-resilience.test.sh (executes the executable fake-gh
        #                                         fixture via PATH + sources
        #                                         lib/discover.sh — neither proven
        #                                         on Git Bash; the fixture's +x bit
        #                                         is not reliably preserved on a
        #                                         Windows checkout) [#196]
        #   - testers-agent-contract.test.sh / testers-rate-limit-audit.test.sh /
        #     testers-rate-limit-wrapper.test.sh (python3 + PyYAML, same reason as
        #                                         testers-pipeline) [#196]
        #   - uberthink.test.sh / uberthink-report.test.sh
        #                                         (python3 -c + mktemp -d paths,
        #                                         same reason as uberscan-report)
        # When a test file is added or removed, update BOTH jobs by hand.
        # tests/ci-wiring.test.sh (#210) enforces this convention as an
        # invariant: it asserts every tests/*.test.sh on disk is wired into
        # the ubuntu run: block AND that (ubuntu − windows) matches the
        # `ci-wiring windows-skip-list` marker block in the windows job
        # below. Ran first in both jobs so a wiring drift reds CI fast.
        run: |
          bash tests/ci-wiring.test.sh && \
          bash tests/turbo-flow.test.sh && \
          bash tests/issue-causal-fanout.test.sh && \
          bash tests/post-impl-review.test.sh && \
          bash tests/testers-pipeline.test.sh && \
          bash tests/spec-reviewer-plan-aware.test.sh && \
          bash tests/audit-fixups.test.sh && \
          bash tests/review-pr.test.sh && \
          bash tests/review-pr-phase3-ci.test.sh && \
          bash tests/cluster.test.sh && \
          bash tests/cluster-pipeline.test.sh && \
          bash tests/code-fixer-dispatch.test.sh && \
          bash tests/findings-to-issues.test.sh && \
          bash tests/trust-trail-evaluator.test.sh && \
          bash tests/finish-branch-auto-chain.test.sh && \
          bash tests/finish-branch.test.sh && \
          bash tests/secret-scan.test.sh && \
          bash tests/aliases.test.sh && \
          bash tests/install.test.sh && \
          bash tests/merge.test.sh && \
          bash tests/ghostty-dispatch-no-instance-leak.test.sh && \
          bash tests/dispatch-claude-bg.test.sh && \
          bash tests/solve-effort-flag.test.sh && \
          zsh tests/solve-pipeline-zsh.test.sh && \
          zsh tests/goal-state-zsh.test.sh && \
          zsh tests/goal-pipeline-zsh.test.sh && \
          zsh tests/finish-branch-zsh.test.sh && \
          bash tests/lib-assert-count.test.sh && \
          bash tests/crossplatform-shell-wrappers.test.sh && \
          bash tests/docs-accuracy.test.sh && \
          bash tests/orchestrator-phase1-shortcircuit.test.sh && \
          bash tests/config-override.test.sh && \
          bash tests/model-routing.test.sh && \
          bash tests/model-routing-config.test.sh && \
          bash tests/run-manifest.test.sh && \
          bash tests/live-semaphore.test.sh && \
          bash tests/orchestrator-plan-flatten.test.sh && \
          bash tests/orchestrator-phase-6-doc.test.sh && \
          bash tests/orchestrator-phase-0-bg-detection.test.sh && \
          bash tests/dev.test.sh && \
          bash tests/dev-pipeline.test.sh && \
          bash tests/solve-claim.test.sh && \
          bash tests/dispatch-fallback.test.sh && \
          bash tests/dispatch-background.test.sh && \
          bash tests/dispatch-codex.test.sh && \
          bash tests/dispatch-wezterm.test.sh && \
          bash tests/ubersimplify.test.sh && \
          bash tests/ubersimplify-aggregate.test.sh && \
          bash tests/simplify.test.sh && \
          bash tests/uberscan.test.sh && \
          bash tests/uberscan-report.test.sh && \
          bash tests/uberscan-chunk.test.sh && \
          bash tests/merge-discovery-resilience.test.sh && \
          bash tests/testers-agent-contract.test.sh && \
          bash tests/testers-rate-limit-audit.test.sh && \
          bash tests/testers-rate-limit-wrapper.test.sh && \
          bash tests/uberthink.test.sh && \
          bash tests/uberthink-report.test.sh && \
          bash tests/goal-state-sidecar.test.sh && \
          bash tests/goal-dispatch-helpers.test.sh && \
          bash tests/using-git-worktrees.test.sh && \
          bash tests/goal.test.sh && \
          bash tests/goal-batch-barrier.test.sh && \
          bash tests/skill-renderer-awk-collision.test.sh && \
          bash tests/dispatch-prompt-no-bare-slash.test.sh && \
          bash tests/bump-version.test.sh && \
          bash tests/test-harness-source-guards.test.sh && \
          bash tests/workflow-scripts.test.sh && \
          bash tests/workflow-args.test.sh && \
          bash tests/testers-workflow.test.sh && \
          bash tests/scan-fleet-workflow.test.sh && \
          bash tests/codex-port.test.sh

  shape-checks-windows:
    name: shape-checks-windows
    runs-on: windows-latest
    # Proves the shape-check harness is Git-Bash-portable on native Windows
    # (RFC 0004 §3.8 / D10). windows-latest ships Git for Windows -> Git Bash
    # is on PATH. Runtime dispatch validation stays out of scope: the suite
    # is grep-and-assert throughout.
    timeout-minutes: 5
    defaults:
      run:
        # Force every `run:` step into Git Bash, not PowerShell or cmd.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run shape-check tests
        # This list MUST match the ubuntu-latest job above MINUS the ubuntu-only
        # Unix-runtime fixtures, which are intentionally skipped here because Git
        # Bash on Windows can't run them reliably:
        #   - solve-pipeline-zsh.test.sh         (no zsh on windows-latest)
        #   - testers-pipeline.test.sh + testers-agent-contract.test.sh +
        #     testers-rate-limit-audit.test.sh + testers-rate-limit-wrapper.test.sh
        #                                         (python3 + PyYAML; the python3 -c
        #                                         invocations embed mktemp -d paths
        #                                         that resolve to /tmp/... strings
        #                                         python.exe can't translate)
        #   - uberscan.test.sh / uberscan-report.test.sh / uberscan-chunk.test.sh
        #                                         (same python3 -c + path reason)
        #   - uberthink.test.sh / uberthink-report.test.sh
        #                                         (same python3 -c + mktemp -d
        #                                         reason as uberscan-report)
        #   - merge-discovery-resilience.test.sh (executes the executable fake-gh
        #                                         fixture via PATH + sources
        #                                         lib/discover.sh — neither proven
        #                                         on Git Bash) [#196]
        #
        # Every test below is a portable grep-and-assert shape-check OR a runtime
        # fixture whose mechanism already runs green on this job. The #196
        # additions reuse: the _lib_assert_structural.sh awk-range lib
        # (code-fixer-dispatch / findings-to-issues / finish-branch / simplify /
        # trust-trail-evaluator); the `bash -c … uberdev_run_secret_scan_stdin`
        # pattern (finish-branch, mirroring secret-scan.test.sh); lib/config-read.sh
        # runtime (findings-to-issues, mirroring config-override.test.sh); and
        # chmod+x-stub execution (install, mirroring solve-effort-flag.test.sh).
        # When a test file is added or removed, update BOTH jobs by hand.
        # tests/ci-wiring.test.sh (#210) enforces the convention as a hard
        # invariant; the canonical Unix-only skip set is the marker block
        # below — a runtime drift fails CI immediately.
        #
        # === BEGIN ci-wiring windows-skip-list ===
        # Canonical SSOT of Unix-only fixtures intentionally skipped on
        # windows-latest. ci-wiring.test.sh W4 asserts
        # (ubuntu − windows) == this list. Update this block AND the run:
        # block below in lockstep; a new Unix-only fixture needs an entry
        # here AND its `bash tests/...` line in the ubuntu job above.
        #   - cluster-pipeline.test.sh
        #   - finish-branch-zsh.test.sh
        #   - goal-pipeline-zsh.test.sh
        #   - goal-state-zsh.test.sh
        #   - solve-pipeline-zsh.test.sh
        #   - testers-pipeline.test.sh
        #   - testers-agent-contract.test.sh
        #   - testers-rate-limit-audit.test.sh
        #   - testers-rate-limit-wrapper.test.sh
        #   - uberscan.test.sh
        #   - uberscan-report.test.sh
        #   - uberscan-chunk.test.sh
        #   - uberthink.test.sh
        #   - uberthink-report.test.sh
        #   - merge-discovery-resilience.test.sh
        #   - model-routing.test.sh
        #   - model-routing-config.test.sh
        #   - run-manifest.test.sh
        #   - live-semaphore.test.sh
        #   - orchestrator-plan-flatten.test.sh
#   - review-pr-phase3-ci.test.sh
#   - lib-assert-count.test.sh
#   - codex-port.test.sh                  (python3 -c + mktemp -d path-translation
#                                         issue on Git Bash, same as uberscan/
#                                         uberthink; also calls rsync which isn't
#                                         on windows-latest's Git Bash)
# === END ci-wiring windows-skip-list ===
        run: |
          bash tests/ci-wiring.test.sh && \
          bash tests/turbo-flow.test.sh && \
          bash tests/issue-causal-fanout.test.sh && \
