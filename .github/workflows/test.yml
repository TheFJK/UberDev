          run_one bash tests/workflow-scripts.test.sh
          run_one bash tests/workflow-args.test.sh
          run_one bash tests/testers-workflow.test.sh
          run_one bash tests/scan-fleet-workflow.test.sh
          run_one bash tests/solve-fleet-workflow.test.sh
          run_one bash tests/turbox-fleet.test.sh
          run_one bash tests/turbox-fleet-runtime.test.sh
          run_one bash tests/review-pr-workflow.test.sh
          run_one bash tests/goal-workflow.test.sh
          run_one bash tests/uberthink-workflow.test.sh
          run_one bash tests/epipe-guard.test.sh
          run_one bash tests/contract-markers.test.sh
          run_one bash tests/schema-property-reads.test.sh
          run_one bash tests/vendor-provenance.test.sh
          run_one bash tests/vendor-drift.test.sh
          run_one bash tests/premerge.test.sh
          run_one bash tests/premerge-findings.test.sh
          run_one bash tests/premerge-phase5.test.sh
          # SHARD-COVERAGE (#753) -- a shard that ran fewer fixtures than its
          # plan named must not be able to report green. A skip is not a
          # failure, so before this tail existed six windows-latest shards
          # executed one fixture each and the job passed.
          #
          # Guarded on the plan being SET. Unset means "run everything", which
          # is the documented default above and the one the standalone
          # extraction of this harness relies on; that path runs against no
          # plan and must keep exiting 0.
          #
          # The denominator is `wc -w`, which splits on ANY whitespace, while
          # the membership gate above splits on spaces only. That asymmetry is
          # the point: a plan whose separators carry a stray byte routes almost
          # nothing while `wc -w` still reports its true length, so the guard
          # disagrees with the corruption instead of inheriting it. Re-deriving
          # the length the way the gate derives it would make this vacuous.
          #
          # No echo below may name a tests/<name>.test.{sh,py} path: the
          # fixture extractor greps this block for exactly that shape once
          # full-line comments are stripped, so an echo carrying one would be
          # read back as a wiring line and enter every shard plan.
          if [ -n "${UBERDEV_SHARD_PLAN-}" ]; then
            shard_plan_len="$(printf '%s' "$UBERDEV_SHARD_PLAN" | wc -w | tr -d ' ')"
            echo "=== SHARD-COVERAGE shard=${UBERDEV_SHARD:-?}/${UBERDEV_SHARDS:-?} plan=$shard_plan_len routed=$shard_routed ran=$shard_ran"
            case "$shard_plan_len" in
              ''|*[!0-9]*|0)
                # A plan that is set but measures no entries would make the
                # comparison below read `0 -ne 0` and buy a green job that ran
                # nothing -- the same silent green this tail exists to refuse.
                # A non-numeric length is worse: `[` exits 2, which `if` reads
                # as false, so the guard would pass BY erroring out.
                echo "=== SHARD-COVERAGE FAIL: the plan is set but its length reads [$shard_plan_len]."
                fail=$((fail + 1))
                failed="${failed}${failed:+ | }SHARD-COVERAGE(plan length unreadable)"
                ;;
              *)
                if [ "$shard_ran" -ne "$shard_plan_len" ]; then
                  echo "=== SHARD-COVERAGE FAIL: planned $shard_plan_len fixture(s), ran $shard_ran."
                  echo "    A shard that runs fewer fixtures than its plan reports green, because a skip is not a failure."
                  echo "    Dump the plan bytes with: bash tests/ci-shard-diagnose.sh dump <job-key> <shards> <shard>"
                  fail=$((fail + 1))
                  failed="${failed}${failed:+ | }SHARD-COVERAGE($shard_ran/$shard_plan_len)"
                fi
                ;;
            esac
          fi
          if [ "$fail" -ne 0 ]; then
            echo "=== $fail test file(s) FAILED: $failed"
            exit 1
          fi
          echo "=== every test file in this block ran and passed"

  supervision-smoke-macos:
    name: supervision-smoke-macos ${{ matrix.shard }}/2
    runs-on: macos-latest
    # Two, not six: this job runs eight fixtures and one of them
    # (agent-dispatch) is over half its measured cost, so the pack floors there.
    # A third shard would add a job that finishes instantly and change no
    # deadline. Without this split macOS becomes the critical path the moment
    # the other two jobs are sharded.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install GNU timeout
        run: brew install coreutils
      - name: Plan shard ${{ matrix.shard }} of 2
        # Writes UBERDEV_SHARD_PLAN / UBERDEV_SHARD / UBERDEV_SHARDS for the step
        # below. Reads the job's own fixture list back out of this file, so the
        # `run_one` lines stay the single source of truth and no manifest can
        # drift from them. Exits non-zero rather than emitting an empty plan --
        # the harness treats an absent plan as "run everything", which is the
        # right default when it is extracted and run standalone and the wrong
        # one when a pack has broken.
        run: bash tests/ci-shard-env.sh supervision-smoke-macos 2 "${{ matrix.shard }}" >> "$GITHUB_ENV"
      - name: Dump shard plan bytes
        # DIAGNOSTIC, NEVER A GATE (#753). The plan crosses a $GITHUB_ENV file
        # between the step above and the step below: this repo's shell writes
        # it, the runner reads it back. The working model is that on
        # windows-latest that boundary is where a trailing CR disappears while
        # the interior ones survive, which is the shape that makes the harness
        # membership test match only the last entry of the plan and reports a
        # green job that ran one fixture. A dump of ONE side cannot tell that
        # apart from a plan with no CR at all, so this step dumps both and
        # probes each planned name through the harness's own rule. It exits 0
        # by design; the gates are the CR refusal in tests/ci-shard-env.sh and
        # the SHARD-COVERAGE tail below. That producing half is MODELLED, not
        # measured — this step is where a Windows runner settles it; see "What
        # is settled, and what is still a model" in
        # plugins/uberdev/docs/testing.md for the refutation condition.
        run: bash tests/ci-shard-diagnose.sh dump supervision-smoke-macos 2 "${{ matrix.shard }}"
      - name: Run focused supervision smoke tests
        # The two dispatch-* fixtures below also run on ubuntu and Windows, but
        # only here do their preflight-arm rows discriminate: the resolver tries
        # the absolute /usr/bin/timeout before any PATH name (RFC 0004 §3.8), and
        # those runners ship one, so the bounded arm is taken there regardless of
        # how each fixture binds its runtime PATH. macOS has no /usr/bin/timeout
        # — GNU timeout arrives from the step above — so it is the only runner
        # where a PATH that drops the host $PATH flips the dispatch onto the
        # UNBOUNDED arm and reds the row (#548). tests/ci-wiring.test.sh pins
        # both names into the macOS required-subset floor.
        run: |
          # De-chained (#628). This block used to be ONE shell command list joined by
          # `&& \`, so the first non-zero exit skipped every invocation after it and the
          # job could only ever report "nothing failed before it stopped". run_one calls
          # every fixture, accumulates the failures, and the tail exits non-zero naming
          # them. tests/ci-wiring.test.sh W12 locks the shape AND runs this harness.
          #
          # SHARDED. UBERDEV_SHARD_PLAN carries this shard's fixture basenames,
          # space-separated, from the plan step above. The list below stays complete and
          # in declaration order in EVERY shard -- it is the single source of truth the
          # plan step reads back out of this file, so a sharded job and an unsharded one
          # cannot disagree about what the suite contains.
          #
          # UNSET means run everything, deliberately: W12.3 extracts this harness and
          # executes it standalone against synthetic fixtures that belong to no plan, and
          # for a test runner the safe default is to run MORE than asked, never less.
          # That default is not how a broken pack arrives here -- tests/ci-shard-env.sh
          # exits non-zero rather than emitting an empty plan, so the job dies at the
          # planning step instead of silently running the whole suite six times.
          fail=0
          failed=""
          shard_routed=0
          shard_ran=0
          run_one() {
            run_one_routed=0
            if [ -n "${UBERDEV_SHARD_PLAN-}" ]; then
              # Keyed on the argument that IS a fixture path, found by scanning.
              # Neither the first nor the last argument works: the interpreter
              # varies (`bash`, `zsh`, `env MSYSTEM=MSYS bash`) and three Windows
              # rows pass a trailing flag (`tests/run-manifest.test.sh
              # --artifact-publication-only`), so keying on the last argument
              # silently dropped exactly those three.
              #
              # And NOT `${*##*/}`: that applies the strip to EACH positional and
              # then joins, so `bash tests/x.test.sh` yields `bash x.test.sh`,
              # matches no plan entry, skips every fixture, and reports a green job
              # that ran nothing.
              #
              # No match means RUN, which is how W12.3's synthetic fixtures
              # (`bash <tmpdir>/a.sh`) survive the filter. Both of these bugs were
              # caught by S8 in tests/ci-shard.test.sh, which drives this function
              # with real argv rather than re-implementing its logic.
              run_one_fixture=""
              for run_one_arg in "$@"; do
                case "$run_one_arg" in
                  tests/*.test.sh|tests/*.test.py) run_one_fixture="${run_one_arg##*/}" ;;
                esac
              done
              if [ -n "$run_one_fixture" ]; then
                shard_routed=$((shard_routed + 1))
                run_one_routed=1
                case " ${UBERDEV_SHARD_PLAN} " in
                  *" ${run_one_fixture} "*) : ;;
                  *) echo "--- SKIP $* (shard ${UBERDEV_SHARD:-?}/${UBERDEV_SHARDS:-?})"; return 0 ;;
                esac
              fi
            fi
            if [ "$run_one_routed" -eq 1 ]; then
              shard_ran=$((shard_ran + 1))
            fi
            echo "--- RUN  $*"
            if "$@"; then
              echo "--- PASS $*"
            else
              rc=$?
              echo "--- FAIL $* (rc=$rc)"
              fail=$((fail + 1))
              failed="${failed}${failed:+ | }$*"
            fi
          }
          run_one bash tests/review-pr-entry.test.sh
          run_one bash tests/agent-dispatch.test.sh
          run_one bash tests/child-dispatch.test.sh
          run_one bash tests/dispatch-child-worktree-teardown.test.sh
          run_one bash tests/dispatch-background.test.sh
          run_one bash tests/dispatch-wezterm.test.sh
          run_one bash tests/review-pr-workflow.test.sh
          run_one bash tests/atomic-move.test.sh
          # SHARD-COVERAGE (#753) -- a shard that ran fewer fixtures than its
          # plan named must not be able to report green. A skip is not a
          # failure, so before this tail existed six windows-latest shards
          # executed one fixture each and the job passed.
          #
          # Guarded on the plan being SET. Unset means "run everything", which
          # is the documented default above and the one the standalone
          # extraction of this harness relies on; that path runs against no
          # plan and must keep exiting 0.
          #
          # The denominator is `wc -w`, which splits on ANY whitespace, while
          # the membership gate above splits on spaces only. That asymmetry is
          # the point: a plan whose separators carry a stray byte routes almost
          # nothing while `wc -w` still reports its true length, so the guard
          # disagrees with the corruption instead of inheriting it. Re-deriving
          # the length the way the gate derives it would make this vacuous.
          #
          # No echo below may name a tests/<name>.test.{sh,py} path: the
          # fixture extractor greps this block for exactly that shape once
          # full-line comments are stripped, so an echo carrying one would be
          # read back as a wiring line and enter every shard plan.
          if [ -n "${UBERDEV_SHARD_PLAN-}" ]; then
            shard_plan_len="$(printf '%s' "$UBERDEV_SHARD_PLAN" | wc -w | tr -d ' ')"
            echo "=== SHARD-COVERAGE shard=${UBERDEV_SHARD:-?}/${UBERDEV_SHARDS:-?} plan=$shard_plan_len routed=$shard_routed ran=$shard_ran"
            case "$shard_plan_len" in
              ''|*[!0-9]*|0)
                # A plan that is set but measures no entries would make the
                # comparison below read `0 -ne 0` and buy a green job that ran
                # nothing -- the same silent green this tail exists to refuse.
                # A non-numeric length is worse: `[` exits 2, which `if` reads
                # as false, so the guard would pass BY erroring out.
                echo "=== SHARD-COVERAGE FAIL: the plan is set but its length reads [$shard_plan_len]."
                fail=$((fail + 1))
                failed="${failed}${failed:+ | }SHARD-COVERAGE(plan length unreadable)"
                ;;
              *)
                if [ "$shard_ran" -ne "$shard_plan_len" ]; then
                  echo "=== SHARD-COVERAGE FAIL: planned $shard_plan_len fixture(s), ran $shard_ran."
                  echo "    A shard that runs fewer fixtures than its plan reports green, because a skip is not a failure."
                  echo "    Dump the plan bytes with: bash tests/ci-shard-diagnose.sh dump <job-key> <shards> <shard>"
                  fail=$((fail + 1))
                  failed="${failed}${failed:+ | }SHARD-COVERAGE($shard_ran/$shard_plan_len)"
                fi
                ;;
            esac
          fi
          if [ "$fail" -ne 0 ]; then
            echo "=== $fail test file(s) FAILED: $failed"
            exit 1
          fi
          echo "=== every test file in this block ran and passed"

  shape-checks-windows:
    name: shape-checks-windows ${{ matrix.shard }}/6
    runs-on: windows-latest
    # Sharded on the same pack as ubuntu. This job runs a SUBSET (the
    # windows-skip-list below is excluded), so its shards are the ubuntu pack
    # restricted to that subset -- the weights are the same relative ordering on
    # every runner, which is all the pack needs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Proves the shape-check harness and routed dispatch lifecycle are portable
    # on native Windows/Git Bash. The exhaustive portability shard's measured
    # runtime outgrew the prior ceiling; thirty minutes provides runner-variance
    # headroom while preserving a meaningful hang guard.
    #
    # Twelve, down from thirty, for the reason the Linux job gives: a shard is
    # not the suite. Windows keeps the larger relative margin of the two -- Git
    # Bash process spawning is the slowest of the three runners and its measured
    # 19-minute total is the least precisely attributed.
    timeout-minutes: 12
    defaults:
      run:
        # Force every `run:` step into Git Bash, not PowerShell or cmd.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Plan shard ${{ matrix.shard }} of 6
        # Writes UBERDEV_SHARD_PLAN / UBERDEV_SHARD / UBERDEV_SHARDS for the step
        # below. Reads the job's own fixture list back out of this file, so the
        # `run_one` lines stay the single source of truth and no manifest can
        # drift from them. Exits non-zero rather than emitting an empty plan --
        # the harness treats an absent plan as "run everything", which is the
        # right default when it is extracted and run standalone and the wrong
        # one when a pack has broken.
        run: bash tests/ci-shard-env.sh shape-checks-windows 6 "${{ matrix.shard }}" >> "$GITHUB_ENV"
      - name: Dump shard plan bytes
        # DIAGNOSTIC, NEVER A GATE (#753). The plan crosses a $GITHUB_ENV file
        # between the step above and the step below: this repo's shell writes
        # it, the runner reads it back. The working model is that on
        # windows-latest that boundary is where a trailing CR disappears while
        # the interior ones survive, which is the shape that makes the harness
        # membership test match only the last entry of the plan and reports a
        # green job that ran one fixture. A dump of ONE side cannot tell that
        # apart from a plan with no CR at all, so this step dumps both and
        # probes each planned name through the harness's own rule. It exits 0
        # by design; the gates are the CR refusal in tests/ci-shard-env.sh and
        # the SHARD-COVERAGE tail below. That producing half is MODELLED, not
        # measured — this step is where a Windows runner settles it; see "What
        # is settled, and what is still a model" in
        # plugins/uberdev/docs/testing.md for the refutation condition.
        run: bash tests/ci-shard-diagnose.sh dump shape-checks-windows 6 "${{ matrix.shard }}"
      - name: Run shape-check tests
        # This list MUST match the ubuntu-latest job above MINUS the ubuntu-only
        # Unix-runtime fixtures, which are intentionally skipped here because Git
        # Bash on Windows can't run them reliably:
        #   - solve-pipeline-zsh.test.sh         (no zsh on windows-latest)
