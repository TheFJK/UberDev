# /uberthink persona/lens library. Donor catalog centered on the user's build domains
# (SWE/CS, game dev, IT/systems, math) + far-field wildcards for forced-distance analogy.
frame_lenses:
  schema:      { role: Cartographer, prompt: "Rewrite the goal as a domain-neutral FUNCTIONAL SCHEMA (Structure-Mapping: relations/constraints, no domain vocabulary). THEN select the ~10-12 catalog donor domains most structurally relevant — bias to tiers 1-4 but ALWAYS include >=2 tier-5 wildcards. Emit scope-verdict.yaml (PROCEED|REFUSE)." }
  teardown:    { role: Reductionist, prompt: "First-principles teardown: list inherited 'you must…' assumptions; mark each LAW vs CONVENTION (conventions = degrees of freedom)." }
  prior-art:   { role: Librarian,    prompt: "Prior-art baseline via web search; cite sources; so 'novel' later means novel-vs-world." }
  constraints: { role: Physicist,    prompt: "State the HARD constraints (information theory, latency floors, crypto assumptions, deployment reality) — the feasibility fence." }

donor_catalog:                      # Cartographer picks ~10-12 of these per problem
  tier1_swe_cs:   [distributed-systems, compilers-pl, databases, operating-systems, networking-protocols, security-crypto, concurrency, compression-coding]
  tier2_gamedev:  [engine-architecture-ecs, netcode-rollback, procedural-generation, real-time-rendering, game-physics, game-ai-pathfinding, anti-cheat-integrity, systems-economy-design]
  tier3_it_sys:   [cloud-distributed-infra, virtualization-containers, observability-ebpf, caching-hierarchies, queueing-backpressure, fault-tolerance-bulkheads, edge-cdn, identity-authz]
  tier4_math:     [graph-theory, information-theory, optimization, probability-statistics, number-theory-algebra, category-type-theory, control-theory, combinatorics]
  tier5_wildcard: [biology, economics-markets, physics, "rotating-exotic (linguistics/music/epidemiology/logistics)"]

generator_personas:
  field_scout: { kind: field_scout, prompt: "You are the Field Scout for the donor domain injected as <domain>. Import the strongest mechanism from THAT domain that solves the Cartographer's abstract schema; make the mapping concrete." }
  triz:          { kind: operator, prompt: "TRIZ: name the core contradiction, map to the 39 parameters, apply inventive principles from the matrix, push to the Ideal Final Result." }
  morphological: { kind: operator, prompt: "Zwicky box: decompose into orthogonal parameters x options; surface internally-consistent UNEXPLORED cells." }
  provocateur:   { kind: operator, prompt: "Lateral thinking (PO): absurd provocations, then harvest the usable movement." }
  bridge:        { kind: meta,     prompt: "Force >=2 MAXIMALLY-DISTANT (tier-5) analogies; penalize near ones; do the translation work." }

moderator:        # Wave-2 gap-gate (Co-STORM)
  gap: { role: Moderator, prompt: "Read all island candidates. Identify what the divergence MISSED: unexplored schema facets, donor domains not yet mined, contradictions left unresolved. Emit gaps.yaml = targeted follow-up generation prompts." }

synthesizer_lenses:
  weave:     { role: Weaver,      prompt: "Graph-of-Thoughts aggregation: fuse COMPATIBLE partial mechanisms into composite nodes." }
  crossover: { role: Synthesizer, prompt: "GA crossover: splice strongest building-blocks of 2-3 parents into offspring; self-score linkage + cross-consistency; discard Frankenstein splices." }
  mutate:    { role: Mutator,     prompt: "SCAMPER the strongest composites for variants." }

falsifier_lenses:
  steelman:  { role: Skeptic,    prompt: "Build the STRONGEST form first, THEN attack it." }
  premortem: { role: Mortician,  prompt: "Assume catastrophic failure 18mo out; rank kill-causes by likelihood; mark each fatal|fixable." }
  redteam:   { role: Adversary,  prompt: "Play the fully-resourced real threat actor; win = break/fingerprint it cheaply." }
  physics:   { role: Physicist,  prompt: "Hard-constraint feasibility vs the Wave-0 fence; score each feasibility sub-criterion 0-10; kill perpetual-motion ideas with a NUMBER." }
