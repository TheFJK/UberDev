<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UberDev / Brainstorm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /*
     * UBERDEV BRAINSTORM — Neo Brutalism frame
     *
     * Palette: dark matte (#0A0A0A / #1A1A1A) + neon pink (#FF2D95)
     * Borders: 3-4px hard ink (#F5F5F5), accents in neon pink
     * Shadows: hard offset, no blur — `8px 8px 0 #FF2D95`
     * Hover: button presses in (translate + shadow collapse)
     * Type:  Archivo Black for display, Space Grotesk for body, IBM Plex Mono for labels
     */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    :root {
      --bg:        #0A0A0A;
      --surface:   #1A1A1A;
      --surface-2: #242424;
      --ink:       #F5F5F5;
      --ink-dim:   #A8A8A8;
      --ink-faint: #6B6B6B;
      --accent:    #FF2D95;
      --accent-hi: #FF5BAB;
      --accent-lo: #B8005E;
      --success:   #00FF9D;
      --warn:      #FFD600;
      --error:     #FF3B5C;

      --border-w:  3px;
      --shadow:    8px 8px 0 var(--accent);
      --shadow-sm: 4px 4px 0 var(--accent);
      --shadow-press: 0 0 0 var(--accent);

      --font-display: 'Archivo Black', 'Space Grotesk', system-ui, sans-serif;
      --font-body:    'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono:    'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      line-height: 1.45;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;

      /* Subtle dot grid — brutalist hint, not noise */
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255, 45, 149, 0.06) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--bg);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--border-w) solid var(--ink);
      flex-shrink: 0;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -7px;
      height: 3px;
      background: var(--accent);
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .header h1 .slash { color: var(--accent); margin: 0 0.4rem; }
    .header h1 .corner {
      display: inline-block;
      width: 0.8rem; height: 0.8rem;
      background: var(--accent);
      margin-right: 0.6rem;
      transform: translateY(1px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .header .status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.6rem;
      border: 2px solid var(--success);
      background: rgba(0, 255, 157, 0.08);
    }
    .header .status::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg);
    }
    .main::-webkit-scrollbar { width: 12px; }
    .main::-webkit-scrollbar-track { background: var(--bg); border-left: 2px solid var(--ink); }
    .main::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid var(--ink); }

    #claude-content { padding: 2rem; min-height: 100%; max-width: 1100px; margin: 0 auto; }

    /* ===== INDICATOR BAR ===== */
    .indicator-bar {
      background: var(--bg);
      border-top: var(--border-w) solid var(--ink);
      padding: 0.85rem 1.5rem;
      flex-shrink: 0;
      text-align: center;
      position: relative;
    }
    .indicator-bar::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: -7px;
      height: 3px;
      background: var(--accent);
    }
    .indicator-bar span {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink-dim);
      text-transform: uppercase;
    }
    .indicator-bar .selected-text {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .indicator-bar .hint {
      display: block;
      font-size: 0.68rem;
      color: var(--ink-faint);
      margin-top: 0.25rem;
      letter-spacing: 0.05em;
    }

    /* ===== TYPOGRAPHY ===== */
    h2 {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      line-height: 1.05;
    }
    h2::before {
      content: '';
      display: inline-block;
      width: 0.5rem; height: 1.4rem;
      background: var(--accent);
      margin-right: 0.6rem;
      transform: translateY(2px);
    }
    h3 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }
    h4 {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    p { color: var(--ink-dim); }
    .subtitle {
      color: var(--ink-dim);
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }
    .section { margin-bottom: 2rem; }
    .label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.6rem;
      font-weight: 700;
    }

    code, pre, .mono {
      font-family: var(--font-mono);
      background: var(--surface);
      padding: 0.1rem 0.35rem;
      border: 1px solid var(--ink-faint);
      font-size: 0.9em;
    }

    /* ===== OPTIONS / CARDS — shared interaction shell ===== */
    /* `.option` and `.card` share identical hover/active/selected behavior
       and the corner checkmark. The shared rules are consolidated here; the
       layout-specific differences live in the dedicated blocks below. */
    .option, .card {
      background: var(--surface);
      border: var(--border-w) solid var(--ink);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, background 0.12s;
      position: relative;
    }
    .option:hover, .card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--accent);
    }
    /* Only `.option` brightens on hover; `.card` keeps its image framing. */
    .option:hover { background: var(--surface-2); }
    .option:active, .card:active {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-press);
    }
    .option.selected, .card.selected {
      border-color: var(--accent);
      box-shadow: var(--shadow);
      transform: translate(-1px, -1px);
    }
    /* `.option` deepens its surface when selected; `.card` keeps its image
       framing intact, so only the border + shadow shift. */
    .option.selected { background: var(--surface-2); }
    .option.selected::after, .card.selected::after {
      content: '✓';
      position: absolute;
      top: -12px; right: -12px;
      width: 28px; height: 28px;
      background: var(--accent);
      color: var(--bg);
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 900;
      box-shadow: 3px 3px 0 var(--ink);
    }

    /* ===== OPTIONS (A/B/C choice rows) ===== */
    .options { display: flex; flex-direction: column; gap: 1rem; }
    .option {
      padding: 1.1rem 1.35rem;
      display: flex;
      align-items: flex-start;
      gap: 1.1rem;
    }
    .option .letter {
      background: var(--bg);
      color: var(--accent);
      border: 2px solid var(--ink);
      width: 2.4rem; height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 3px 3px 0 var(--accent);
      text-transform: uppercase;
    }
    .option.selected .letter {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .option .content { flex: 1; }
    .option .content h3 { font-size: 0.98rem; margin-bottom: 0.25rem; color: var(--ink); }
    .option .content p { color: var(--ink-dim); font-size: 0.88rem; margin: 0; }

    /* ===== CARDS (mockup tiles) ===== */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .card { overflow: hidden; }

    .card-image {
      background: var(--bg);
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: var(--border-w) solid var(--ink);
      position: relative;
    }
    .card-image::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(45deg, transparent 49%, rgba(255, 45, 149, 0.08) 49% 51%, transparent 51%);
      background-size: 14px 14px;
      pointer-events: none;
    }
    .card-body { padding: 1.1rem 1.25rem; }
    .card-body h3 { margin-bottom: 0.3rem; color: var(--ink); }
    .card-body p { color: var(--ink-dim); font-size: 0.88rem; }

    /* ===== MOCKUP CONTAINER ===== */
    .mockup {
      background: var(--surface);
      border: var(--border-w) solid var(--ink);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 1.75rem;
    }
    .mockup-header {
      background: var(--bg);
      padding: 0.6rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 2px solid var(--ink);
      font-weight: 700;
    }
    .mockup-body { padding: 1.5rem; }

    /* ===== SPLIT VIEW ===== */
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 700px) { .split { grid-template-columns: 1fr; } }

    /* ===== PROS / CONS ===== */
    .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
    .pros, .cons {
      background: var(--surface);
      padding: 1rem 1.1rem;
      border: 2px solid var(--ink);
    }
    .pros { border-left: 6px solid var(--success); }
    .cons { border-left: 6px solid var(--error); }
    .pros h4 { color: var(--success); }
    .cons h4 { color: var(--error); }
    .pros ul, .cons ul {
      margin-left: 1rem;
      font-size: 0.88rem;
      color: var(--ink-dim);
      list-style: none;
    }
    .pros li::before { content: '+ '; color: var(--success); font-weight: 700; }
    .cons li::before { content: '− '; color: var(--error); font-weight: 700; }
    .pros li, .cons li { margin-bottom: 0.3rem; }

    /* ===== PLACEHOLDER ===== */
    .placeholder {
      background: var(--surface);
      border: 3px dashed var(--accent);
      padding: 2rem;
      text-align: center;
      color: var(--ink-faint);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ===== INLINE MOCK ELEMENTS ===== */
    .mock-nav {
      background: var(--accent);
      color: var(--bg);
      padding: 0.85rem 1.1rem;
      display: flex;
      gap: 1.5rem;
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 3px solid var(--ink);
    }
    .mock-sidebar {
      background: var(--bg);
      padding: 1rem;
      min-width: 180px;
      border-right: 2px solid var(--ink);
      color: var(--ink-dim);
      font-size: 0.9rem;
    }
    .mock-content { padding: 1.5rem; flex: 1; }
    .mock-button {
      background: var(--accent);
      color: var(--bg);
      border: 2px solid var(--ink);
      padding: 0.55rem 1.1rem;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .mock-button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .mock-button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
    .mock-input {
      background: var(--surface);
      border: 2px solid var(--ink);
      padding: 0.55rem 0.7rem;
      width: 100%;
      color: var(--ink);
      font-family: var(--font-mono);
    }
    .mock-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 3px 3px 0 var(--accent);
    }

    /* ===== SUBMIT BUTTON (lock-in) ===== */
    .submit-row {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .submit-btn {
      background: var(--accent);
      color: var(--bg);
      border: 3px solid var(--ink);
      padding: 0.85rem 1.5rem;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
    }
    .submit-btn:hover {
      background: var(--accent-hi);
      transform: translate(-2px, -2px);
      box-shadow: 10px 10px 0 var(--ink);
    }
    .submit-btn:active {
      transform: translate(8px, 8px);
      box-shadow: var(--shadow-press);
    }
    .submit-btn[disabled] {
      background: var(--surface);
      color: var(--ink-faint);
      cursor: not-allowed;
      box-shadow: var(--shadow-sm);
    }
    .submit-btn[disabled]:hover {
      transform: none;
      box-shadow: var(--shadow-sm);
    }
    .submit-status {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .submit-status.locked {
      color: var(--success);
      font-weight: 700;
    }

    /* ===== WAITING / NEXT PHASE LOADER ===== */
    .waiting-block {
      margin-top: 1.5rem;
      border: var(--border-w) solid var(--ink);
      background: var(--surface);
      padding: 1.1rem 1.35rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      box-shadow: var(--shadow);
      animation: waiting-slidein 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .waiting-block::before {
      content: '';
      position: absolute;
      left: -3px; top: -3px; bottom: -3px;
      width: 8px;
      background: var(--accent);
      animation: waiting-edge 1.2s ease-in-out infinite;
    }
    @keyframes waiting-slidein {
      from { opacity: 0; transform: translate(-8px, -8px); box-shadow: 16px 16px 0 var(--accent); }
      to   { opacity: 1; transform: translate(0, 0);       box-shadow: var(--shadow); }
    }
    @keyframes waiting-edge {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    .waiting-block .col { display: flex; flex-direction: column; flex: 1; gap: 0.2rem; }
    .waiting-block .col .label { margin: 0; }
    .waiting-block .status-text {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .waiting-block .dots::after {
      content: '';
      display: inline-block;
      width: 1.5em;
      text-align: left;
      animation: waiting-dots 1.4s steps(4, end) infinite;
    }
    @keyframes waiting-dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
    .waiting-block .timer {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.06em;
      padding: 0.25rem 0.6rem;
      background: var(--bg);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--accent);
      min-width: 4.5rem;
      text-align: center;
    }
    .waiting-block .timer-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      margin-top: 0.25rem;
    }
    .waiting-block .timer-col { display: flex; flex-direction: column; align-items: center; gap: 0; }

    /* Brutalist marching bricks loader */
    .brut-bricks {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .brut-bricks span {
      display: block;
      width: 12px;
      height: 32px;
      background: var(--accent);
      border: 2px solid var(--ink);
      transform-origin: bottom center;
      animation: brut-brick-pulse 1.05s ease-in-out infinite;
    }
    .brut-bricks span:nth-child(1) { animation-delay: 0s; }
    .brut-bricks span:nth-child(2) { animation-delay: 0.12s; }
    .brut-bricks span:nth-child(3) { animation-delay: 0.24s; }
    .brut-bricks span:nth-child(4) { animation-delay: 0.36s; }
    .brut-bricks span:nth-child(5) { animation-delay: 0.48s; }
    @keyframes brut-brick-pulse {
      0%, 100% { transform: scaleY(0.35); opacity: 0.4; }
      45%      { transform: scaleY(1);    opacity: 1; }
    }

    /* Tiny phase chips above the loader */
    .phase-track {
      display: flex;
      gap: 6px;
      margin-bottom: 0.4rem;
    }
    .phase-chip {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border: 1.5px solid var(--ink-faint);
      color: var(--ink-faint);
      background: var(--bg);
    }
    .phase-chip.done {
      border-color: var(--success);
      color: var(--success);
      background: rgba(0, 255, 157, 0.06);
    }
    .phase-chip.active {
      border-color: var(--accent);
      color: var(--bg);
      background: var(--accent);
      box-shadow: 2px 2px 0 var(--ink);
      animation: phase-active-pulse 1.4s ease-in-out infinite;
    }
    @keyframes phase-active-pulse {
      0%, 100% { box-shadow: 2px 2px 0 var(--ink); }
      50%      { box-shadow: 4px 4px 0 var(--ink); }
    }

    /* ===== FOOTER STRIP ===== */
    .footer-strip {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--ink-faint);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0 1.5rem 0.5rem;
      display: flex;
      justify-content: space-between;
      background: var(--bg);
      flex-shrink: 0;
    }
    .footer-strip .pulse { color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span class="corner"></span>UBERDEV<span class="slash">/</span>BRAINSTORM
    </h1>
    <div class="status">LIVE</div>
  </div>

  <div class="main">
    <div id="claude-content">
      <!-- CONTENT -->
    </div>
  </div>

  <div class="indicator-bar">
    <span id="indicator-text">CLICK AN OPTION ABOVE — THEN PRESS LOCK IN</span>
    <span class="hint">After locking, switch to Claude and hit enter to continue</span>
  </div>

  <div class="footer-strip">
    <span>UBERDEV BRAINSTORM // NEO BRUTAL UI</span>
    <span class="pulse">●</span>
    <span>v0.3.0</span>
  </div>

</body>
</html>
