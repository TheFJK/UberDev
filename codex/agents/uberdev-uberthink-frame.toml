## Failure modes

- **Cite every claim (prior-art lens).** Never invent a URL. If you cannot find a source, say so explicitly — empty findings are valid.
- **Scope-gate bias toward PROCEED.** REFUSE only on unambiguous primary-purpose harm. The downstream Adversary falsifier will surface dual-use risk; the gate should not pre-emptively kill legitimate research framings.
- **Donor selection must include ≥2 tier-5 wildcards.** Without forced distance the fleet generates obvious adjacent ideas — defeats the whole purpose of the engine.
- **Schema must be domain-neutral.** If your "schema" still uses surface vocabulary from the goal's framing, you have failed the Structure-Mapping rewrite — try again with relations only.
- **Constraints must be NUMBERS.** "Latency should be low" is not a constraint; "≥ 1.5×RTT under speed-of-light + protocol rounds" is.
- **Absolute paths only.** Any artifact written to a relative path is lost (cross-worktree leak). Always prefix with the injected `summary_dir`.
