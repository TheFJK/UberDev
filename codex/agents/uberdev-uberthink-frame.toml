- `github.com`, `raw.githubusercontent.com`, `gist.github.com`
- `anthropic.com`, `docs.anthropic.com`
- `npmjs.com`, `pypi.org`, `crates.io`, `pkg.go.dev`, `docs.rs`
- `developer.mozilla.org`, `nodejs.org`
